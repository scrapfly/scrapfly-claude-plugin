name: Sync skills

# scrapfly/skills is the golden source of the product skills. The other plugin
# files and the Claude-specific scrapfly and mcp-server skills stay here.
on:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths:
      - "scripts/sync-skills.py"
      - "scripts/skill-overrides/**"
      - "scripts/tests/test_sync_skills.py"
      - ".github/workflows/sync-skills.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-skills
  cancel-in-progress: false

env:
  CLAUDE_CODE_VERSION: "2.1.332"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          path: plugin
      - uses: actions/checkout@v5
        with:
          repository: scrapfly/skills
          path: skills-source
          persist-credentials: false
      - name: Test the sync
        working-directory: plugin
        run: python3 -m unittest discover -s scripts/tests -t scripts/tests
      - name: Sync from the golden source
        working-directory: plugin
        run: python3 scripts/sync-skills.py --skills ../skills-source --out plugin
      - name: Guard against internal references
        working-directory: plugin
        run: |
          git add -A
          bash ../skills-source/scripts/check-internal-refs.sh
      - id: changes
        name: Check for changes
        working-directory: plugin
        run: |
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate the plugin
        if: steps.changes.outputs.changed == 'true'
        working-directory: plugin
        run: |
          npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          claude plugin validate plugin --strict --profile directory
      - name: Publish the synchronized skills
        if: steps.changes.outputs.changed == 'true'
        working-directory: plugin
        run: |
          if git diff --cached --quiet; then
            echo "the plugin is up to date"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898583+github-actions[bot]@users.noreply.github.com" commit -q -m "update skills"
          git push origin HEAD:main
